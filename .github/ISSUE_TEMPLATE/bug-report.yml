name: Bug report
description: Something's wrong with a ponytail hook, skill or host integration
title: "bug: "
labels:
  - bug
body:
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: Claude Code 2.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the hook output or log
    validations:
      required: true

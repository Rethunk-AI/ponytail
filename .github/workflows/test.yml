name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Rethunk-Tech/gh-actions/setup-bun@4c3240b9077c81a6f03f499dafaec6494220aad5 # v1.27
      # Same target as the local gate and lefthook's pre-push, so CI cannot drift from them.
      # tests/hermes-plugin.test.ts runs the Hermes plugin under the runner's python3.
      - run: bun run ci
